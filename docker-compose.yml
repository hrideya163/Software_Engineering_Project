# docker compose up --build
#   app  -> http://localhost:8001  (frontend + FastAPI)
services:
  app:
    build: .
    ports: ["8001:8001"]
    env_file: [.env]
    environment:
      CONTRIMAP_ALLOWED_ORIGINS: http://localhost:8001
      CONTRIMAP_PUBLIC_API_URL: http://localhost:8001
      CONTRIMAP_FRONTEND_URL: http://localhost:8001
    volumes:
      - contrimap-cache:/app/data   # git trees, snapshots, embedding cache
volumes:
  contrimap-cache:
