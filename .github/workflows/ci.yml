name: CI

on:
  push:
    branches: [main, contrimap-v2]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ml.txt
      # test_v2 - test_v6 need no network, models or artifacts. test_pipeline trains the legacy
      # models and downloads the sentence embedder, so it runs in its own step.
      - name: Unit and API tests
        run: python -m pytest contrimap_ml/test_v2.py contrimap_ml/test_v3.py contrimap_ml/test_v4.py contrimap_ml/test_v5.py contrimap_ml/test_v6.py -q
      - name: Legacy pipeline tests
        run: python -m pytest contrimap_ml/test_pipeline.py -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vite build
        env:
          VITE_BASE: /

  docker:
    name: Docker image builds and serves /api/health
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (without trained artifacts)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: contrimap:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container and wait for the health check
        run: |
          docker run -d --name contrimap -p 8001:8001 contrimap:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8001/api/health | python3 -c "import json,sys; body=json.load(sys.stdin); assert body['status']=='ok', body; print(body)"
          curl -fsS http://127.0.0.1:8001/ | grep -q '<div id="root">'
      - if: failure()
        run: docker logs contrimap
